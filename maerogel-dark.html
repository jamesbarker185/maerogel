<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Maerogel</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(800px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="dark"><main class="iso-page"><style>.mg .iso-plate {
  overflow: hidden;
}

.mg {
  --mg-void: #cfcfca;
  --mg-cavity: #94a2a7;
  --mg-char: #3b342e;
  --mg-ash: #f6f5f0;
  --mg-fleck: #c9c6bb;
  --mg-grain: #a07d33;
  --mg-hot: #e8590c;
  --mg-on: #30a46c;
  --mg-off: #d6d6d3;
  --mg-cloud: #8f8c84;
  --mg-water: #7fa3b0;
  --mg-sol: #dceaee;
  --mg-gel: #c3d9e3;
  --mg-net: #4f6b78;
  --mg-pore: #b9d6e2;
  --mg-smoke: #8f8f8a;
  --mg-vapour: #a9b7bc;
  --mg-petal: #e0597f;
  --mg-petal-line: #b23e63;
  --mg-pistil: #f0bd2b;
  --mg-leaf: #63a35a;
  --mg-flame: #f47a1f;
  --mg-flame-core: #ffe6a8;
  --mg-flame-blue: #3d78d8;
  --mg-heat: #e5484d;
}

.iso[data-theme="dark"] .mg {
  --mg-void: #0b0b0b;
  --mg-cavity: #0d1214;
  --mg-char: #121010;
  --mg-ash: #d9d8d2;
  --mg-fleck: #8a877e;
  --mg-off: #2a2a2a;
  --mg-cloud: #a5a299;
  --mg-sol: #22343b;
  --mg-gel: #2f4a55;
  --mg-net: #b8d4df;
  --mg-pore: #26404a;
  --mg-smoke: #8a8a86;
  --mg-vapour: #6e7e84;
}

/* Material token sets: each redefines the kit's paper, shades and top for what the part is made of. */
.mg-husk {
  --anatomy-paper: #e6c983;
  --anatomy-face: #e6c983;
  --anatomy-top: #efd697;
  --anatomy-shade-0: #c69f52;
  --anatomy-shade-1: #d2ae62;
  --anatomy-shade-2: #dcbb71;
  --anatomy-shade-3: #e5c780;
}
.mg-amber {
  --anatomy-paper: #c8996c;
  --anatomy-top: #d6ad84;
  --anatomy-shade-0: #9c6b40;
  --anatomy-shade-1: #ab7a4d;
  --anatomy-shade-2: #b98a5c;
  --anatomy-shade-3: #c7996b;
}
.mg-hose {
  --anatomy-top: #f0a37a;
  --anatomy-shade-0: #c4572b;
  --anatomy-shade-2: #de7a4c;
}
.mg-liquid,
.mg-acid {
  --anatomy-paper: #d7e8ee;
  --anatomy-top: #e3f0f4;
  --anatomy-shade-0: #c1d7df;
  --anatomy-shade-1: #c9dde4;
  --anatomy-shade-2: #d0e2e8;
  --anatomy-shade-3: #d7e7ec;
}
.mg-liquid > .iso-solid,
.mg-acid > .iso-solid {
  opacity: 0.82;
}
.mg-gel {
  --anatomy-paper: #c9dde5;
  --anatomy-top: #d9e8ee;
  --anatomy-shade-0: #a9c3ce;
  --anatomy-shade-1: #b4cbd5;
  --anatomy-shade-2: #bed3dc;
  --anatomy-shade-3: #c7dae2;
}
.mg-wet {
  --anatomy-paper: #8fb4c4;
  --anatomy-top: #9fc0ce;
  --anatomy-shade-0: #7aa1b2;
  --anatomy-shade-1: #82a8b9;
  --anatomy-shade-2: #8aafbf;
  --anatomy-shade-3: #92b6c5;
}
.mg-aero {
  --anatomy-paper: #dceaf5;
  --anatomy-top: #eaf3fa;
  --anatomy-shade-0: #bdd3e6;
  --anatomy-shade-1: #c8daeb;
  --anatomy-shade-2: #d2e2f0;
  --anatomy-shade-3: #dce9f4;
}
.mg-aero > .iso-solid > .iso-fill,
.mg-aero > .iso-solid > .iso-shade,
.mg-aero > .iso-solid > .iso-top {
  fill-opacity: 0.88;
}
.mg-glass > .iso-solid > .iso-fill {
  fill: #e6f0f3;
  fill-opacity: 0.5;
}
.mg-glass > .iso-solid > .iso-shade {
  opacity: 0.4;
}
.mg-glass > .iso-solid > .iso-top {
  fill-opacity: 0.35;
}
.mg-inside {
  --anatomy-mid: #b5c3c8;
  --anatomy-lo: #9aa9ae;
}
.iso[data-theme="dark"] .mg :is(.mg-husk, .mg-amber, .mg-liquid, .mg-acid, .mg-gel, .mg-wet, .mg-aero, .mg-hose) {
  --anatomy-paper: inherit;
}

.mg-fillface {
  fill: var(--anatomy-top);
  stroke: none;
}
.mg-grain {
  fill: none;
  stroke: var(--mg-grain);
  stroke-width: 0.55;
  stroke-linecap: round;
}
.mg-void {
  fill: var(--mg-void);
  stroke: none;
}
.mg-cavity {
  fill: var(--mg-cavity);
  stroke: none;
}
.mg-floor {
  fill: var(--anatomy-shade-1);
  stroke: none;
}
.mg-char {
  fill: var(--mg-char);
}
.mg-ash {
  fill: var(--mg-ash);
}
.mg-ash-fleck {
  fill: none;
  stroke: var(--mg-fleck);
  stroke-width: 0.5;
  stroke-linecap: round;
}
.mg-coil path {
  fill: none;
  stroke: var(--mg-hot);
  stroke-width: 1.3;
}
.mg-lamp {
  fill: var(--mg-off);
}
.mg-lamp[data-on] {
  fill: var(--mg-on);
}
.mg-lamp[data-hot] {
  fill: var(--mg-hot);
}
.mg-step {
  fill: var(--anatomy-faint);
}
.mg-step[data-on] {
  fill: var(--anatomy-hi);
}
.mg-cloud circle {
  fill: var(--mg-cloud);
}
.mg-meniscus {
  stroke: var(--mg-water) !important;
}
.mg-shine,
.mg-glare {
  fill: none;
  stroke: #ffffff;
  stroke-width: 1.6;
  stroke-linecap: round;
  opacity: 0.75;
}
.iso[data-theme="dark"] .mg :is(.mg-shine, .mg-glare) {
  opacity: 0.18;
}
.mg-sol {
  fill: var(--mg-sol);
}
.mg-gelface {
  fill: var(--mg-gel);
}
.mg-ceramic {
  fill: #ebe6de;
  stroke: none;
}
.iso[data-theme="dark"] .mg-ceramic {
  fill: #2a2725;
}
.mg-glowface path {
  fill: var(--mg-flame);
}
.mg-petal {
  fill: var(--mg-petal);
  stroke: var(--mg-petal-line);
  stroke-width: 0.4;
  stroke-linejoin: round;
}
.mg-pistil {
  fill: var(--mg-pistil);
  stroke: #b8891a;
  stroke-width: 0.4;
}
.mg-leaf {
  fill: var(--mg-leaf);
  stroke: #3f7a38;
  stroke-width: 0.4;
}
.mg-stem {
  stroke: #4f8a46 !important;
  stroke-width: 0.9 !important;
}
.mg-smoke path,
.mg-vapour path {
  fill: none;
  stroke: var(--mg-smoke);
  stroke-width: 1.4;
  stroke-linecap: round;
}
.mg-vapour path {
  stroke: var(--mg-vapour);
}
.mg-vapour circle {
  fill: #ffffff;
  opacity: 0.8;
}
.mg-lensbg {
  fill: var(--anatomy-card);
}
.mg-lensglare {
  fill: none;
  stroke: #ffffff;
  stroke-width: 1.4;
  stroke-dasharray: 22 400;
  stroke-dashoffset: -150;
  opacity: 0.8;
}
.mg-liquidfill {
  fill: var(--mg-pore);
}
.mg-air {
  fill: var(--anatomy-card);
}
.mg-link {
  fill: none;
  stroke: var(--mg-net);
  stroke-width: 1.1;
  stroke-linecap: round;
}
.mg-np {
  fill: var(--mg-net);
}
.mg-carry-dot[data-kind="husk"] {
  fill: #c9a24e;
}
.mg-carry-dot[data-kind="ash"] {
  fill: #b9b7ae;
}
.mg-carry-dot[data-kind="drop"] {
  fill: var(--mg-water);
}
.mg-flame-outer {
  fill: url(#mg-flame-grad);
}
.mg-flame-inner {
  fill: var(--mg-flame-blue);
  opacity: 0.85;
}
.mg-heat path {
  fill: url(#mg-heat-grad);
  stroke: none;
}

.mg-credit {
  position: absolute;
  top: 34px;
  right: 20px;
  color: var(--anatomy-muted);
  font-family: var(--anatomy-mono);
  font-size: 9.5px;
  letter-spacing: 0.06em;
  line-height: 1;
  pointer-events: none;
}
.mg-heat-btn {
  position: absolute;
  top: 30px;
  left: 20px;
  z-index: 2;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 9px 3px 7px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  box-shadow: 0 0 0 1px var(--anatomy-faint);
  color: var(--anatomy-text);
  font: 10px/1.4 var(--anatomy-mono);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
}
.mg-heat-btn:hover,
.mg-heat-btn:focus-visible {
  box-shadow: 0 0 0 1px var(--anatomy-mid);
  outline: none;
}
.mg-heat-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--mg-off);
  transition: background 0.3s;
}
.mg-heat-btn[aria-pressed="true"] .mg-heat-dot {
  background: var(--mg-flame);
}

.mg-stage {
  position: relative;
  touch-action: pan-y;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  cursor: ew-resize;
  margin: 0 -8px;
}
.mg-stage:focus-visible {
  outline: 1px solid var(--anatomy-muted);
  outline-offset: 6px;
}
.mg-stage > svg {
  display: block;
  width: 100%;
  height: auto;
}
.mg-said {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

.mg-specs {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  margin: 0;
  border-left: 1px solid var(--anatomy-faint);
}
.mg-specs > div {
  padding: 10px 12px 9px;
  border: 1px solid var(--anatomy-faint);
  border-left: 0;
  border-top: 0;
}
.mg-specs dt {
  color: var(--anatomy-muted);
  font-family: var(--anatomy-mono);
  font-size: 9.5px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.mg-specs dt i {
  font-style: normal;
  text-transform: none;
  letter-spacing: 0.02em;
  opacity: 0.8;
}
.mg-specs dd {
  margin: 3px 0 0;
  color: var(--anatomy-strong);
  font-family: var(--anatomy-mono);
  font-size: 13px;
  font-variant-numeric: tabular-nums;
  transition: opacity 0.4s;
}
.mg-specs dd[data-empty] {
  opacity: 0.35;
}

@media (max-width: 560px) {
  .mg-credit {
    top: 32px;
    right: 12px;
    font-size: 8.5px;
  }
  .mg-heat-btn {
    top: auto;
    bottom: 64px;
    left: 12px;
  }
  .mg .iso-plate-corner[data-corner="title"] {
    font-size: 9px;
    letter-spacing: 0.05em;
    max-width: 62%;
    white-space: normal;
    text-align: right;
    line-height: 1.3;
  }
  .mg-credit {
    top: 46px;
  }
  .mg-stage {
    margin: 0 -10px;
  }
  .mg-specs {
    grid-template-columns: repeat(2, 1fr);

.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

// Maerogel: rice husk to silica aerogel. One progress value p runs 0..6 through the six stations.
// Sourced: ash silica 92–97% amorphous (UTM / Prof. Halimaton Hamdan), cost about 80% below conventional
// aerogel (Merdeka Award citation). The dissolve, gel and dry steps are the generic sol-gel route, not the
// patent's own conditions. Porosity and density are illustrative values for a silica aerogel.

const ASH_SILICA = [92, 97]; // % amorphous SiO2 in the white ash
const COST_SAVING = 80; // % lower than conventional aerogel, per the Merdeka Award citation
const POROSITY = 95; // % air, illustrative (silica aerogels run above 90%)
const DENSITY = 0.1; // g/cm3, illustrative (under 0.2)
const GEL_DENSITY = 1.05; // g/cm3 of the wet gel, mostly liquid, illustrative

const STAGES = [
  { key: "husk", name: "Rice husk", says: "mill waste; about a fifth of its mass burns to ash" },
  { key: "burn", name: "Burning", says: "controlled burn in air leaves white ash" },
  { key: "dissolve", name: "Dissolving", says: "ash + NaOH → sodium silicate (generic)" },
  { key: "gel", name: "Gelling", says: "acid sets a silica network, pores full of liquid" },
  { key: "dry", name: "Drying", says: "liquid leaves, network stays (generic)" },
  { key: "aerogel", name: "Aerogel", says: "mostly air in a silica lattice" },
];

const clamp01 = (x) => Math.min(1, Math.max(0, x));
const smooth01 = (a, b, x) => {
  const t = clamp01((x - a) / (b - a));
  return t * t * (3 - 2 * t);
};

// Everything the drawing shows, as a function of p.
function stateAt(p) {
  const i = Math.min(5, Math.max(0, Math.floor(p)));
  const burn = smooth01(1.15, 1.85, p); // husk in the dish: 0 golden, 1 white ash
  const char = smooth01(1.1, 1.45, p) * (1 - smooth01(1.5, 1.9, p)); // black stage in between
  const dissolved = smooth01(2.25, 2.9, p); // ash cloud in the beaker clears
  const set = smooth01(3.3, 3.9, p); // sol in the mould sets to gel
  const liquid = 1 - smooth01(4.15, 4.9, p); // share of pore volume still liquid
  const tile = smooth01(5.25, 5.45, p);
  return {
    i,
    stage: STAGES[i],
    burn,
    char,
    dissolved,
    set,
    liquid,
    tile,
    porosity: i >= 3 ? POROSITY : null,
    density: i < 3 ? null : i < 4 ? GEL_DENSITY : DENSITY + (GEL_DENSITY - DENSITY) * liquid,
  };
}

function readoutOf(p, heat) {
  const s = stateAt(p);
  const head = `${s.i + 1}/6 · ${s.stage.name}`;
  if (s.i === 4) return `${head} · pores ${Math.round(s.liquid * 100)}% liquid`;
  if (s.i === 5 && heat) return `${head} · flame on · top stays cool`;
  if (s.i === 1) return `${head} · ${s.burn < 0.98 ? "husk → ash" : `ash ${ASH_SILICA[0]}–${ASH_SILICA[1]}% SiO₂`}`;
  if (s.i === 2) return `${head} · ${Math.round(s.dissolved * 100)}% dissolved`;
  if (s.i === 3) return `${head} · ${s.set < 0.98 ? "sol → gel" : "wet gel"}`;
  if (s.i === 5) return `${head} · ~${POROSITY}% air`;
  return `${head} · golden husk`;
}

// ------------------------------------------------------------ carriers between stations
const CARRY = [
  { kind: "husk", t: [0.55, 0.95], a: D.HEAP, b: [D.CRU.o[0], D.CRU.o[1], D.CRU.top], h: 42, n: 6 },
  { kind: "ash", t: [2.0, 2.25], a: [D.CRU.o[0], D.CRU.o[1], D.CRU.top], b: [D.BK.o[0], D.BK.o[1], D.BK.o[2] + D.BK.h], h: 52, n: 6 },
  { kind: "drop", t: [3.0, 3.3], a: [D.BK.o[0] + D.BK.r + 2, 0, D.BK.o[2] + D.BK.h - 1], b: [D.MOULD.x, D.MOULD.y, D.MOULD.top + 1], h: 30, n: 7 },
  { kind: "block", t: [4.0, 4.14], a: [D.MOULD.x, D.MOULD.y, 3], b: [D.PORT[0], D.PORT[1] + 6, D.PORT[2] - 6], h: 40 },

];
const arcAt = (c, u) => {
  const p = lerp3(c.a, c.b, u);
  p[2] += c.h * 4 * u * (1 - u);
  return p;
};
for (const c of CARRY) {
  const g = document.createElementNS(NS, "g");
  g.style.opacity = "0";
  if (c.kind === "block" || c.kind === "tile") {
    const b = c.kind === "block" ? D.MOULD.block : { x: -D.TILE.w / 2, y: -D.TILE.d / 2, w: D.TILE.w, d: D.TILE.d, r: D.TILE.r };
    const h = c.kind === "block" ? 8 : D.TILE.h;
    g.innerHTML = `<g class="${c.kind === "block" ? "mg-gel" : "mg-aero"}">${solidSvg(slabOf(b, 0, h, P, 2, 0.4), { tone: "mid" })}</g>`;
  } else {
    g.innerHTML = Array.from({ length: c.n }, () => (c.kind === "husk" ? `<ellipse class="mg-carry-dot" data-kind="husk" rx="1.4" ry="0.6"/>` : `<circle class="mg-carry-dot" data-kind="${c.kind}" r="${c.kind === "drop" ? 1.2 : 1}"/>`)).join("");
  }
  el.carry.append(g);
  c.g = g;
}
function drawCarry(p, time) {
  for (const c of CARRY) {
    const u = (p - c.t[0]) / (c.t[1] - c.t[0]);
    const on = u > 0 && u < 1;
    opacity(c.g, on ? Math.min(1, u * 8, (1 - u) * 6) : 0);
    if (!on) continue;
    if (c.kind === "block" || c.kind === "tile") {
      c.g.setAttribute("transform", translateAlong(P, arcAt(c, u)));
    } else {
      [...c.g.children].forEach((dot, i) => {
        const v = Math.min(1, Math.max(0, u * 1.35 - i * 0.06));
        const [x, y] = at(arcAt(c, v));
        dot.setAttribute("cx", f1(x + Math.sin(i * 2.3 + time * 3) * 0.6));
        dot.setAttribute("cy", f1(y));
        dot.style.opacity = v <= 0 || v >= 1 ? "0" : "1";
      });
    }
  }
}

// ------------------------------------------------------------ wisps (smoke and vapour)
function wisps(group, base, rise, count, time, spread, alpha) {
  if (alpha < 0.004) {
    if (group.childElementCount) group.innerHTML = "";
    opacity(group, 0);
    return;
  }
  opacity(group, alpha);
  const [x0, y0] = at(base);
  const lines = [];
  for (let i = 0; i < count; i++) {
    const ph = (time * 0.35 + i / count) % 1;
    const pts = [];
    for (let j = 0; j <= 10; j++) {
      const s = j / 10;
      const yy = y0 - (ph * 0.5 + s * 0.5) * rise;
      const xx = x0 + (i - (count - 1) / 2) * spread + Math.sin(s * 5 + time * 1.6 + i * 2) * (1 + s * 3);
      pts.push(`${f1(xx)} ${f1(yy)}`);
    }
    const fade = Math.sin(Math.PI * ph);
    lines.push(`<path d="M${pts.join("L")}" style="opacity:${(fade * 0.8).toFixed(2)}"/>`);
  }
  group.innerHTML = lines.join("");
}

// ------------------------------------------------------------ stirrer bar
function stirbarAt(angle) {
  const [cx, cy, z] = D.BK.o;
  const c = Math.cos(angle);
  const s = Math.sin(angle);
  const ring = [];
  for (let i = 0; i < 12; i++) {
    const t = (i / 12) * Math.PI * 2;
    const u = Math.cos(t) * 6;
    const v = Math.sin(t) * 1.3;
    ring.push([cx + u * c - v * s, cy + u * s + v * c]);
  }
  return solidSvg(extrude(ring, z + 0.8, 1.6, P), { tone: "mid", crease: "none" });
}

const FB = at(D.BUN);

  const a = onFace(XC - half * 2.2, z - half * 1.6);
  const b = onFace(XC, z);
  const c = onFace(XC + half * 2.2, z - half * 1.6);
  const c2 = onFace(XC + half * 2.2, z - half * 2.4);
  const b2 = onFace(XC, z - half * 0.8);
  const a2 = onFace(XC - half * 2.2, z - half * 2.4);
  return `M${[a, b, c, c2, b2, a2].map((p) => `${f1(p[0])} ${f1(p[1])}`).join("L")}Z`;
}
const heatBox = (() => {
  const top = onFace(XC, D.TILE.z + D.TILE.h);
  const bot = onFace(XC, D.TILE.z - 4);
  return { top: top[1], bot: bot[1] };
})();
function drawHeat(time, level) {
  opacity(el.heat, level);
  if (level < 0.004) return;
  const z0 = D.TILE.z;
  const z1 = D.TILE.z + D.TILE.h * 0.78;
  const parts = [`<path d="${arrowShape(z0 - 4, z1, 1.8)}"/>`];
  for (let i = 0; i < 3; i++) {
    const ph = (time * 0.55 + i / 3) % 1;
    const z = z0 + 3 + ph * (z1 - z0 - 2);
    const fade = (1 - ph) * Math.min(1, ph * 6);
    parts.push(`<path d="${chevron(z, 2.2)}" style="opacity:${fade.toFixed(2)}"/>`);
  }
  el.heat.innerHTML = parts.join("");
  const grad = svg.querySelector("#mg-heat-grad");
  grad.setAttribute("gradientUnits", "userSpaceOnUse");
  grad.setAttribute("x1", "0");
  grad.setAttribute("x2", "0");
  grad.setAttribute("y1", f1(heatBox.bot));
  grad.setAttribute("y2", f1(heatBox.top + 2));
}

// ------------------------------------------------------------ the network in the lens
const NET = D.NET;
const LR = D.LENS_R * 0.92;
el.lensLiquid.innerHTML = `<circle class="mg-liquidfill" r="${f1(D.LENS_R)}"/>` + NET.pores.map(([x, y, r]) => `<circle class="mg-air" cx="${f1(x * LR)}" cy="${f1(y * LR)}" r="0"/>`).join("");
const lensFill = el.lensLiquid.children[0];
const lensAir = [...el.lensLiquid.children].slice(1);
el.lensLinks.innerHTML = NET.links.map(() => `<line class="mg-link"/>`).join("");
const linkEls = [...el.lensLinks.children];
el.lensDots.innerHTML = NET.pts.map(() => `<circle class="mg-np" r="${f1(0.036 * LR)}"/>`).join("");
const dotEls = [...el.lensDots.children];
function drawLens(p, time, liquid) {
  const toSol = smooth01(2.2, 2.9, p);
  const toGel = smooth01(3.15, 3.9, p);
  const brown = toSol * (1 - toGel);
  const pos = NET.pts.map((g, i) => {
    const a = NET.ash[i];
    const s = NET.sol[i];
    const x0 = a[0] + (s[0] - a[0]) * toSol;
    const y0 = a[1] + (s[1] - a[1]) * toSol;
    const jx = Math.sin(time * 1.3 + i * 1.7) * 0.03 * brown;
    const jy = Math.cos(time * 1.1 + i * 2.3) * 0.03 * brown;
    return [(x0 + (g[0] - x0) * toGel + jx) * LR, (y0 + (g[1] - y0) * toGel + jy) * LR];
  });
  dotEls.forEach((d, i) => {
    d.setAttribute("cx", f1(pos[i][0]));
    d.setAttribute("cy", f1(pos[i][1]));
  });
  const linked = smooth01(3.55, 3.95, p);
  linkEls.forEach((l, j) => {
    const [a, b] = NET.links[j];
    l.setAttribute("x1", f1(pos[a][0]));
    l.setAttribute("y1", f1(pos[a][1]));
    l.setAttribute("x2", f1(pos[b][0]));
    l.setAttribute("y2", f1(pos[b][1]));
  });
  opacity(el.lensLinks, linked);
  // Liquid is there from the dissolve to the end of drying; each pore empties on its own as the liquid leaves.
  const wet = smooth01(2.1, 2.35, p);
  opacity(lensFill, wet * (0.25 + 0.75 * Math.min(1, liquid * 1.4)));
  lensAir.forEach((c, j) => {
    const [, , r, order] = NET.pores[j];
    const open = smooth01(4.1 + order * 0.6, 4.3 + order * 0.6, p) * wet;
    c.setAttribute("r", f1(r * LR * open));
  });
}

// ------------------------------------------------------------ state and loop
const STEP_SECONDS = 3.2;
const HOLD = 6;
let p = 0;
let target = 0;
let touring = !still.matches;
let clock = 0;
let userHeat = null;
let heatLevel = 0;
let bar = 0;
let barRate = 0;
let time = 0;
let frame = 0;
let last = 0;
let visible = false;
let idleTimer = 0;
const tourAt = (t) => {
  const cycle = 6 * STEP_SECONDS + HOLD;
  const c = t % cycle;
  return Math.min(6, c / STEP_SECONDS);
};
const heatWanted = () => (userHeat !== null ? userHeat : touring && p > 5.6);

function draw() {
  const s = stateAt(Math.min(p, 5.999));
  const busy = (a, b) => smooth01(a, a + 0.12, p) * (1 - smooth01(b - 0.12, b, p));
  // Step marks on the bench.
  el.steps.forEach((m, i) => flag(m, "data-on", i <= s.i));
  // 1. falling husk while the heap is fed.
  const feeding = 1 - smooth01(0.9, 1.1, p);
  opacity(el.fall, feeding);
  fallDots.forEach((d, i) => {
    const ph = (time * 0.9 + i / fallDots.length) % 1;
    d.setAttribute("cx", f1(FALL_TOP[0] + (FALL_BOT[0] - FALL_TOP[0]) * ph + Math.sin(i * 3.1) * 1.5));
    d.setAttribute("cy", f1(FALL_TOP[1] + (FALL_BOT[1] - FALL_TOP[1]) * ph * ph));
  });
  // 2. burn.
  const burning = busy(1.05, 2.0);
  opacity(el.coil, burning * (0.75 + 0.25 * Math.sin(time * 2.4)));
  flag(el.lampBurn, "data-hot", burning > 0.5);
  opacity(el.cru, smooth01(0.85, 1.0, p) * (1 - smooth01(2.0, 2.15, p)));
  opacity(el.cruChar, s.char);
  opacity(el.cruAsh, s.burn);
  wisps(el.smoke, [D.CRU.o[0], D.CRU.o[1], D.CRU.top + 1], 26, 3, time, 4, busy(1.15, 1.95) * (1 - s.burn * 0.6));
  // 3. dissolve.
  opacity(el.cloud, smooth01(2.12, 2.3, p) * (1 - s.dissolved) * (1 - smooth01(3.9, 4, p)));
  const stirring = busy(2.05, 3.05);
  flag(el.lampStir, "data-on", stirring > 0.5);
  barRate += ((stirring * 9) - barRate) * 0.05;
  // 4. gel.
  opacity(el.mould, smooth01(3.05, 3.3, p) * (1 - smooth01(4.0, 4.1, p)));
  opacity(el.mouldGel, s.set);
  const dripping = busy(3.25, 3.85);
  drips.forEach((d, i) => {
    const ph = (time * 1.4 + i * 0.5) % 1;
    const [x, y] = [DRIP_TOP[0], DRIP_TOP[1] + (DRIP_BOT[1] - DRIP_TOP[1]) * ph * ph];
    d.setAttribute("cx", f1(x));
    d.setAttribute("cy", f1(y));
    d.style.opacity = (dripping * Math.min(1, (1 - ph) * 5)).toFixed(2);
  });
  // 5. dry.
  opacity(el.dryBlock, smooth01(4.1, 4.18, p) * (1 - smooth01(5.0, 5.08, p)));
  opacity(el.dryWet, s.liquid * 0.85);
  const drying = busy(4.1, 5.0);
  wisps(el.ventVapour, D.VENT, 30, 2, time, 3, drying * Math.max(0.25, s.liquid));
  wisps(el.dryVapour, D.DRY_BLOCK, 10, 3, time * 1.5, 5, drying * s.liquid);
  const pressure = 0.06 + 0.7 * drying * (0.6 + 0.4 * s.liquid);
  gaugeShare += (pressure - gaugeShare) * 0.06;
  el.gauge.setAttribute("d", needleAt(gaugeShare));
  flag(el.lampDry[0], "data-on", drying > 0.5);
  flag(el.lampDry[1], "data-on", p >= 5);
  // 6. tile, flame and heat.
  opacity(el.tile, s.tile);
  el.tile.setAttribute("transform", translateAlong(P, [0, 0, (1 - s.tile) * 10]));
  opacity(el.flame, heatLevel);
  if (heatLevel > 0.004) {
    flameOuter.setAttribute("d", flamePath(time, 1));
    flameInner.setAttribute("d", flamePath(time + 0.3, 0.38));
  }
  opacity(el.gauzeGlow, heatLevel * 0.3);
  drawHeat(time, heatLevel * s.tile);
  drawCarry(p, time);
  drawLens(p, time, s.liquid);
  // Words.
  const text = readoutOf(p, heatLevel > 0.5 && s.i === 5);
  if (readout.textContent !== text) readout.textContent = text;
  const ps = s.i < 3 ? "—" : s.i === 3 ? "~95% · liquid" : s.i === 4 ? `~95% · ${Math.round(s.liquid * 100)}% liq.` : ">90% air";
  const ds = s.i < 3 ? "—" : `~${s.density.toFixed(2)} g/cm³`;
  if (el.specPorosity.textContent !== ps) el.specPorosity.textContent = ps;
  if (el.specDensity.textContent !== ds) el.specDensity.textContent = ds;
  flag(el.specPorosity, "data-empty", s.i < 3);
  flag(el.specDensity, "data-empty", s.i < 3);
  stage.setAttribute("aria-valuenow", String(s.i + 1));
  stage.setAttribute("aria-valuetext", s.stage.name);
  heatBtn.setAttribute("aria-pressed", String(heatWanted()));
}
let gaugeShare = 0.06;

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  const calm = still.matches;
  time += calm ? 0 : dt;
  if (touring) {
    clock += dt;
    target = tourAt(clock);
  }
  p = calm ? target : p + (target - p) * (1 - Math.exp(-dt / (touring ? 0.05 : 0.45)));
  if (Math.abs(target - p) < 0.0005) p = target;
  const wantHeat = heatWanted() ? 1 : 0;
  heatLevel = calm ? wantHeat : heatLevel + (wantHeat - heatLevel) * (1 - Math.exp(-dt / 0.35));
  bar += barRate * dt;
  el.stirbar.innerHTML = stirbarAt(bar);
  draw();
  frame = visible ? requestAnimationFrame(tick) : 0;
}
const run = () => {
  if (!frame && visible) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
};
const resumeLater = () => {
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if (still.matches) return;
    touring = true;
    clock = p * STEP_SECONDS;
    run();
  }, 4000);
};
const steer = (next) => {
  touring = false;
  target = Math.min(6, Math.max(0, next));
  resumeLater();
  run();
};
const announce = () => {
  const s = stateAt(Math.min(target, 5.999));
  said.textContent = `${s.stage.name}: ${s.stage.says}`;
};
new IntersectionObserver((entries) => {
  visible = entries[entries.length - 1].isIntersecting;
  if (visible) run();
}, { rootMargin: "120px 0px" }).observe(stage);
stage.addEventListener("pointermove", (event) => {
  const box = svg.getBoundingClientRect();
  const share = ((event.clientX - box.left) / box.width - 0.06) / 0.86;
  steer(share * 6);
});
stage.addEventListener("pointerleave", resumeLater);
stage.addEventListener("keydown", (event) => {
  let to = null;
  const here = Math.min(5, Math.floor(target + 0.001));
  if (/^[1-6]$/.test(event.key)) to = Number(event.key) - 1 + 0.55;
  if (event.key === "ArrowRight" || event.key === "ArrowUp") to = Math.min(5, here + 1) + 0.55;
  if (event.key === "ArrowLeft" || event.key === "ArrowDown") to = Math.max(0, here - 1) + 0.55;
  if (event.key === "Home") to = 0.55;
  if (event.key === "End") to = 6;
  if (event.key === "h" || event.key === "H") {
    toggleHeat();
    event.preventDefault();
    return;
  }
  if (to === null) return;
  event.preventDefault();
  steer(to === 5.55 ? 6 : to);
  announce();
});
function toggleHeat() {
  userHeat = !heatWanted();
  if (userHeat && target < 5.5) steer(6);
  said.textContent = userHeat ? "Flame on under the tile. The flower on top stays cool." : "Flame off.";
  run();
}
heatBtn.addEventListener("click", toggleHeat);
still.addEventListener("change", () => {
  touring = !still.matches;
  run();
});
if (still.matches) target = p = 6;
draw();
window.__mg = {
  get p() { return p; },
  set: (v) => { touring = false; clearTimeout(idleTimer); target = p = v; run(); },
  heat: (on) => { userHeat = on; heatLevel = on ? 1 : 0; run(); },
  tour: (on) => { touring = on; run(); },
};
</script></body></html>
